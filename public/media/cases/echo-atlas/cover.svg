<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">回声地图封面</title>
  <desc id="desc">深色背景上由橙色同心声波、坐标网格和细线构成的抽象封面。</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#f3ede2" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".08"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="#12110f"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>
  <ellipse cx="780" cy="600" rx="530" ry="530" fill="url(#glow)"/>
  <g fill="none" stroke="#f3ede2" stroke-opacity=".56">
    <path d="M225 726C286 422 561 199 859 265s457 345 414 620-372 358-650 247S168 1004 225 726Z" stroke-width="1.3"/>
