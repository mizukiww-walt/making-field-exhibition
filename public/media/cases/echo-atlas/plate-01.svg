<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">声景采样轨迹</title>
  <desc id="desc">黑色背景上，橙色声波曲线穿过由坐标点组成的城市采样地图。</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#f2eee6" stroke-opacity=".08"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".09"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="#11110f"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <g stroke="#f2eee6" stroke-opacity=".28" fill="none">
    <path d="M100 148H1500M100 852H1500"/>
    <path d="M100 120V880M1500 120V880"/>
    <path d="M100 500H1500" stroke-dasharray="2 9"/>
  </g>
  <g fill="#f2eee6" opacity=".55">
    <circle cx="241" cy="361" r="3"/><circle cx="318" cy="688" r="3"/>
    <circle cx="473" cy="294" r="3"/><circle cx="559" cy="601" r="3"/>
    <circle cx="684" cy="389" r="3"/><circle cx="749" cy="728" r="3"/>
    <circle cx="902" cy="324" r="3"/><circle cx="1014" cy="660" r="3"/>
    <circle cx="1141" cy="421" r="3"/><circle cx="1268" cy="276" r="3"/>
    <circle cx="1334" cy="607" r="3"/><circle cx="1401" cy="741" r="3"/>
    <circle cx="613" cy="806" r="3"/><circle cx="879" cy="793" r="3"/>
  </g>
  <path d="M100 602C169 587 180 451 248 460s81 151 152 142 83-193 167-202 83 185 166 187 94-229 177-234 92 273 183 270 102-240 195-229 99 209 212 193 97-108 180-97 91 119 120 122"
    fill="none" stroke="#ff5a1f" stroke-width="2.6"/>
  <path d="M100 602C169 587 180 451 248 460s81 151 152 142 83-193 167-202 83 185 166 187 94-229 177-234 92 273 183 270 102-240 195-229 99 209 212 193 97-108 180-97 91 119 120 122"
    fill="none" stroke="#ff5a1f" stroke-width="24" stroke-opacity=".08"/>
  <g fill="none" stroke="#f2eee6">
    <circle cx="749" cy="728" r="14" stroke-opacity=".5"/>
    <circle cx="749" cy="728" r="34" stroke-opacity=".3"/>
    <circle cx="749" cy="728" r="58" stroke-opacity=".15"/>
  </g>
  <g fill="#f2eee6" font-family="'Cascadia Code','SFMono-Regular',monospace">
    <text x="100" y="72" font-size="17" letter-spacing="3">ACOUSTIC TRANSECT / 17 POINTS</text>
    <text x="1500" y="72" font-size="17" text-anchor="end">2025.03—05</text>
    <text x="100" y="940" font-size="14" fill-opacity=".55">SOLID LINE = STREET-LEVEL AMPLITUDE</text>
    <text x="1500" y="940" font-size="14" text-anchor="end" fill-opacity=".55">RECORDED 07:00—22:00</text>
  </g>
  <g font-family="'Cascadia Code',monospace" font-size="13" fill="#f2eee6" fill-opacity=".65">
    <text x="257" y="345">P-01 / 72dB</text>
    <text x="494" y="279">P-04 / 68dB</text>
    <text x="1037" y="645">P-11 / 81dB</text>
    <text x="760" y="766" fill="#ff5a1f" fill-opacity="1">P-08 / PEAK</text>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".55"/>
</svg>
